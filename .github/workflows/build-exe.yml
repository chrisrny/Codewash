name: Build Windows EXE

# Une release seulement quand on pousse un tag de version (voir « Publier une version » dans le README),
# plus un lancement à la main depuis l'onglet Actions pour tester le build sans rien publier.
# Avant, chaque push sur main créait une release (DEBT-13).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    # Runner Windows hébergé par GitHub : bloqué sur l'orga Epitech tant que la facturation n'est pas réglée (DEBT-19)
    runs-on: windows-latest

    permissions:
      contents: write # création de la release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite project
        run: npm run build

      - name: Build Electron app
        run: npm run electron:build

      - name: Upload Windows Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: LevelUpRPG-Windows-Portable
          path: release/LevelUpRPG-Portable.exe
          if-no-files-found: error

      - name: Create Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Level Up RPG ${{ github.ref_name }}
          body: |
            ## Level Up RPG - Windows Portable Version

            Download the portable `.exe` file below and double-click to play!

            No installation required - perfect for sharing via flash drive.

            ### What's included:
            - All game assets and themes
            - Sound effects and music
            - Complete game experience in a single executable

            ### How to run:
            1. Download `LevelUpRPG-Portable.exe`
            2. Double-click to launch
            3. Have fun!
          files: release/LevelUpRPG-Portable.exe

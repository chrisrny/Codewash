name: CI

on:
  pull_request:
  push:
    branches:
      - dev

permissions:
  contents: read

# Les runners self-hosted sont partagés entre les équipes : un nouveau push annule le run en cours
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Les runners hébergés par GitHub sont bloqués sur l'orga Epitech (facturation),
    # on passe par les runners self-hosted fournis par l'école
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          # Electron ne sert qu'au build .exe (build-exe.yml), inutile de télécharger son binaire ici
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Lint + complexity (ESLint)
        run: npm run lint

      - name: Duplication (jscpd)
        run: npm run duplication

      - name: Format
        run: npm run format:check

      - name: Tests + coverage thresholds
        run: npm run coverage

      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node --input-type=module >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import { readFileSync } from 'node:fs';
          import config from './vitest.config.js';
          const total = JSON.parse(readFileSync('coverage/coverage-summary.json')).total;
          const min = config.test.coverage.thresholds;
          console.log('| | Coverage | Seuil |\n|---|---:|---:|');
          for (const k of ['lines', 'statements', 'branches', 'functions'])
              console.log(`| ${k} | ${total[k].pct} % | ${min[k]} % |`);
          EOF

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Build
        run: npm run build
